name: Debug Build (TMDB merge)

on:
  workflow_dispatch:

jobs:
  debug:
    name: Build mobile-arm64 debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Verify bundled MPV native assets
        run: bash scripts/verify_mpv_native_assets.sh --require-elf

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android packages
        run: |
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;37.0.0" "ndk;29.0.14206865" "cmake;3.22.1"

      - name: Build mobile-arm64 debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleMobileArm64_v8aDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: webhtv-tmdb-mobile-arm64-debug
          path: app/build/outputs/apk/mobileArm64_v8a/debug/*.apk
          retention-days: 30
